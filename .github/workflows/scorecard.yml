name: Scorecard

# OpenSSF Scorecard. Runs on push to develop (the default branch) and on a
# weekly schedule — deliberately NOT on pull_request, so it never gates a PR.
#
# The repo is public, so Scorecard's publish_results (the point of running
# Scorecard on a public OSS project — it publishes the rating) and the
# code-scanning SARIF upload both work. publish_results is true and the steps
# hard-fail rather than being continue-on-error, so a broken run is visible
# instead of silently green (panelist#84).
#
# NB (observed while flipping in #84): scorecard-action only runs on the DEFAULT
# branch — a workflow_dispatch on a feature branch fails with "Only the default
# branch develop is supported". That is why this flip is verified by the
# push-to-develop run after merge, not on the PR (Scorecard never runs on a PR).

on:
  push:
    branches: [develop]
  schedule:
    - cron: "30 1 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
