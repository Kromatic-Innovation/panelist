name: Scorecard

# OpenSSF Scorecard. Runs on push to develop (the default branch) and on a
# weekly schedule — deliberately NOT on pull_request, so it never gates a PR.
#
# ADVISORY until go-public: Scorecard's publish_results and the code-scanning
# SARIF upload need a PUBLIC repo (and/or GitHub Advanced Security) to succeed.
# While plenum is private, publish_results is false and the private-only steps
# are continue-on-error so this never leaves a red run on develop. At the OSS
# go-public gate: set publish_results: true and drop the continue-on-error.

on:
  push:
    branches: [develop]
  schedule:
    - cron: "30 1 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        continue-on-error: true
        with:
          results_file: results.sarif
          results_format: sarif
          # false while private; flip to true at the OSS go-public gate.
          publish_results: false

      - name: Upload SARIF results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3
        continue-on-error: true
        with:
          sarif_file: results.sarif
