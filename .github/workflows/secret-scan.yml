name: Secret Scan

# Secret scanning with the free, MIT-licensed gitleaks CLI run directly.
# NOTE: we deliberately do NOT use gitleaks/gitleaks-action here — that Action
# wrapper requires a paid GITLEAKS_LICENSE for organization-owned repositories
# (Kromatic-Innovation is an org). The gitleaks binary itself is free and has
# no such requirement, so we download a pinned release and run it.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Run gitleaks (pinned binary)
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          # Scan the working tree (current files). Non-zero exit on any finding.
          /tmp/gitleaks dir . --no-banner --redact --verbose
