name: Release

# Publishes panelist to the PUBLIC npm registry
# (https://registry.npmjs.org). This is DISTINCT from publish.yml, which
# publishes the same package to GitHub Packages for internal/org consumers.
#
# Trigger model:
#   - `push: tags: ['v*']` — the real release path. A human (or the
#     Releasing process in CONTRIBUTING.md) tags a commit `vX.Y.Z` and
#     pushes the tag, which runs `npm publish --access public`.
#   - `workflow_dispatch` — manual runs, for validating the pipeline without
#     cutting a release. Defaults to `dry_run: true`, and anything other than
#     an explicit `dry_run: false` is treated as a dry run (see the guard on
#     the publish step below) — so a manual run can never do a real publish
#     by accident.
#
# Auth is npm Trusted Publishing (OIDC) — no NPM_TOKEN secret, no long-lived
# credential anywhere. `id-token: write` (below) lets npm CLI >=11.5.1 mint a
# short-lived OIDC token and exchange it with the registry at publish time.
# This requires a one-time bootstrap: npm's Trusted Publisher can only be
# attached to a package that already exists, so the FIRST publish for a new
# package must be a manual `npm publish` from a maintainer's logged-in
# machine; every release after that runs through this workflow with zero
# stored secrets. See tickle-stick's release.yml for the working reference.
#
# `--provenance` attaches npm provenance attestation to the published
# package, which requires `id-token: write` permission (below) so the job
# can mint an OIDC token to sign the attestation.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (no real publish)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Publish to public npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Run tests (pre-publish gate)
        run: node --test test/*.test.mjs

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'false'
        run: npm publish --dry-run --access public

      - name: Publish (real)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        run: npm publish --access public --provenance
