name: Release

# Publishes panelist to the PUBLIC npm registry
# (https://registry.npmjs.org). This is DISTINCT from publish.yml, which
# publishes the same package to GitHub Packages for internal/org consumers.
#
# The publish steps that used to be inlined here now live in a shared
# reusable workflow, code-workspace-config's npm-oidc-publish.yml (cwc#1439),
# which panelist / ideate-core / tickle-stick all call. Centralising the
# steps means a future npm gotcha (the npm@11 trusted-publishing pin, the
# publishConfig strip, provenance gating) is fixed once and every caller
# inherits it, instead of each repo's release.yml drifting out of sync — the
# exact drift that forced the 2026-07-21 npm@11 OIDC fix to be hand-copied
# into this repo after two wrong intermediate fixes.
#
# Trigger model (unchanged by the migration):
#   - `push: tags: ['v*']` — the real release path. A human (or the
#     Releasing process in CONTRIBUTING.md) tags a commit `vX.Y.Z` and
#     pushes the tag, which runs a real `npm publish --access public`.
#   - `workflow_dispatch` — manual runs, for validating the pipeline without
#     cutting a release. Defaults to `dry_run: true`; only an explicit
#     `dry_run: false` performs a real publish, so a manual run can never do
#     a real publish by accident.
#
# Auth is npm Trusted Publishing (OIDC) — no NPM_TOKEN secret, no long-lived
# credential anywhere. The reusable workflow's `id-token: write` permission
# (granted on the caller job below, since permissions are NOT inherited into
# a called workflow) lets npm CLI >=11.5.1 mint a short-lived OIDC token and
# exchange it with the registry at publish time. panelist is already
# bootstrapped as a Trusted Publisher, so no per-release secret is needed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (no real publish)"
        required: false
        type: boolean
        default: true

jobs:
  release:
    name: Publish to public npm
    # Permissions are NOT inherited into a called workflow — the caller job
    # must grant them, or OIDC token minting + provenance attestation fail.
    permissions:
      contents: read
      id-token: write
    uses: Kromatic-Innovation/code-workspace-config/.github/workflows/npm-oidc-publish.yml@main
    with:
      # panelist has no build step and no runtime/dev dependencies, so skip
      # both `npm run build` and `npm ci` — mirrors the inlined workflow,
      # which ran neither. `strip-publish-config-registry` (default true)
      # deletes package.json's `publishConfig.registry` (GitHub Packages) in
      # CI so the release targets npmjs.org.
      build: false
      install: false
      test-command: "node --test test/*.test.mjs"
      # push (tag) → real publish; workflow_dispatch → dry run unless the
      # dispatcher explicitly set dry_run: false.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
