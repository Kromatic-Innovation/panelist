name: Dependency Review

# plenum ships with zero runtime dependencies, so this passes trivially today
# — it's here as a gate against any future dependency introducing a known
# vulnerability or an unacceptable license.
#
# ADVISORY until go-public: the dependency-review API requires the GitHub
# dependency graph, which on a PRIVATE repo needs GitHub Advanced Security.
# Until plenum is public (the OSS release gate), the action can return 403, so
# the step is marked continue-on-error to avoid a spurious red check on a
# zero-dependency repo. Flip continue-on-error off when the repo goes public.

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
