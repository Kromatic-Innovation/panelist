name: Dependency Review

# panelist ships with zero runtime dependencies, so this passes trivially today
# — it's here as a gate against any future dependency introducing a known
# vulnerability or an unacceptable license. The repo is public, so the
# dependency-review API works without GitHub Advanced Security and this step
# now hard-gates: a future dependency carrying a known CVE or an unacceptable
# license fails the check rather than producing a green one (panelist#84).

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
