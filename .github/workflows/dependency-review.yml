name: Dependency Review

# panelist ships with zero runtime dependencies, so this passes trivially today
# — it's here as a HARD gate against any future dependency introducing a known
# vulnerability or an unacceptable license. panelist is a published public npm
# package, so a bad transitive dependency would ship to every consumer.
#
# HARD gate (no continue-on-error) as of panelist#103. When #84 first tried this
# (2026-07-30) the action reported "Dependency review is not supported on this
# repository" because Dependency graph was not yet enabled — a repo/org ADMIN
# setting. The repo went public 2026-07-20 and the operator has since enabled
# Dependabot + code-scanning alerts (which require Dependency graph), so the
# blocking condition has lapsed and the gate now blocks PRs on a failing review.

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
