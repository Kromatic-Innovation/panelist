name: Dependency Review

# panelist ships with zero runtime dependencies, so this passes trivially today
# — it's here as a HARD gate against any future dependency introducing a known
# vulnerability or an unacceptable license. panelist is a published public npm
# package, so a bad transitive dependency would ship to every consumer.
#
# HARD gate (no continue-on-error) as of panelist#103. When #84 first tried this
# (2026-07-30) the action reported "Dependency review is not supported on this
# repository. Please ensure that Dependency graph is enabled" because the
# repo's Dependency graph feature — a repo/org ADMIN setting the automation
# cannot toggle — was not yet enabled. The operator explicitly enabled
# Dependency graph on 2026-08-02, verified directly via the dependency-graph
# SBOM endpoint (GET /repos/Kromatic-Innovation/panelist/dependency-graph/sbom),
# which now returns a real SBOM where it previously returned 404. With the
# precondition confirmed, continue-on-error is dropped and the gate now blocks
# PRs on a failing review. Follow-up to #84.

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
