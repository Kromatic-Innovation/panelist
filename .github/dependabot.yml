version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # CodeQL refuses mismatched init/analyze versions, so every
      # github/codeql-action path must be bumped in one PR (panelist#240).
      codeql:
        patterns:
          - "github/codeql-action*"
